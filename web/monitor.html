<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>nano-cuda-moe · Monitor</title>
<style>
:root{
  --bg:#0e1116; --surface:#151a21; --surface2:#1b222b; --line:#252d38; --ink:#e7edf4; --muted:#8b97a8;
  --accent:#5ecf9e; --warn:#e8b04b; --bad:#e06a6a; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei",Inter,system-ui,sans-serif;
}
html[data-theme="light"]{--bg:#f6f7f9;--surface:#fff;--surface2:#f0f2f5;--line:#dfe3e9;--ink:#1b2129;--muted:#66707e;--accent:#159f6f;--warn:#b5761b;--bad:#c0392b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
header{height:60px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{font-size:18px;font-weight:700;letter-spacing:-.3px}
.brand span{font-size:12px;font-weight:400;color:var(--muted);margin-left:10px}
button{font:inherit;color:inherit;cursor:pointer;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:7px 12px}
button:hover{border-color:var(--accent)}
a.back{color:var(--muted);text-decoration:none;font-size:13px}
a.back:hover{color:var(--accent)}
main{max-width:1400px;margin:0 auto;padding:22px 24px 40px}
h2{font-size:15px;margin:26px 0 12px;letter-spacing:.3px}
h2 .sub{font-weight:400;font-size:12px;color:var(--muted);margin-left:8px}
.grid{display:grid;gap:12px}
.cards{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.tiles{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.label{font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted)}
.value{font-size:25px;font-weight:500;margin-top:4px;font-variant-numeric:tabular-nums}
.value small{font-size:13px;color:var(--muted);font-weight:400;margin-left:3px}
.note{font-size:11.5px;color:var(--muted);margin-top:4px;font-family:var(--mono);overflow-wrap:anywhere}
.spark{display:block;width:100%;height:34px;margin-top:8px}
.spark polyline{fill:none;stroke:var(--accent);stroke-width:1.6;vector-effect:non-scaling-stroke}
.spark .fill{fill:var(--accent);opacity:.12;stroke:none}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:8px;vertical-align:1px}
.idle .dot{background:var(--muted)}.gen .dot{background:var(--warn)}.read .dot{background:var(--accent)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 20px;font-size:13px}
.facts div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-bottom:5px}
.facts b{font-family:var(--mono);font-weight:500}
.err{margin-top:14px;padding:10px 14px;border-radius:9px;background:rgba(224,106,106,.12);color:var(--bad);display:none}
footer{color:var(--muted);font-size:12px;margin-top:26px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media(max-width:640px){main{padding:16px 14px}.value{font-size:21px}}
</style>
</head>
<body>
<header>
  <div class="brand">nano-cuda-moe <span>Monitor</span></div>
  <div><a class="back" href="/">← 对话页</a> <button id="theme">切换主题</button></div>
</header>
<main>
  <div id="err" class="err"></div>

  <div class="grid cards">
    <div class="card"><div class="label">服务状态</div><div class="value" id="state"><span class="dot"></span>连接中…</div><div class="note" id="state-note">—</div></div>
    <div class="card"><div class="label">本次生成速度</div><div class="value" id="speed">—<small>tok/s</small></div><div class="note" id="speed-note">—</div></div>
    <div class="card"><div class="label">本次 prefill</div><div class="value" id="prefill">—<small>tok/s</small></div><div class="note" id="prefill-note">—</div></div>
    <div class="card"><div class="label">已完成请求</div><div class="value" id="reqs">—</div><div class="note" id="reqs-note">—</div></div>
  </div>

  <h2>实时请求 <span class="sub" id="live-id"></span></h2>
  <div class="card grid facts" id="live"></div>

  <h2>引擎 <span class="sub" id="engine-model"></span></h2>
  <div class="card grid facts" id="engine"></div>

  <h2>硬件 <span class="sub" id="hw-static"></span></h2>
  <div class="grid tiles" id="tiles"></div>

  <h2>累计 <span class="sub">自服务启动</span></h2>
  <div class="card grid facts" id="totals"></div>

  <footer><span>每 2 秒轮询 <code>/metrics</code>；序列保留最近 60 个采样点（1 Hz）。Prometheus: <code>/metrics/prometheus</code></span><span id="updated">—</span></footer>
</main>
<script src="/monitor.js"></script>
</body></html>
